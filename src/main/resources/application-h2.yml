# ── H2 In-Memory Demo Profile ────────────────────────────────────────────────
# Run WITHOUT Docker/MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Dashboard → http://localhost:8080
# H2 Console → http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:jobbot)
#
# NOTE: data is lost on restart (in-memory).
#       For persistent data, use the default MySQL profile.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:h2:mem:jobbot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

notification:
  enabled: false
  to-email: ""
  from-email: ""
